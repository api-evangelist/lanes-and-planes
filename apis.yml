aid: lanes-and-planes
name: Lanes & Planes
description: 'Lanes & Planes is a Munich-based travel and expense (T&E) management platform
  that positions itself as the financial infrastructure for European corporate travel. The
  platform covers the full T&E lifecycle in one system: travel request, digital approval
  flows, booking, and final accounting. Its inventory spans European rail (Deutsche Bahn,
  ÖBB, SBB, SNCF), flights from the major global carriers and alliances including NDC content,
  over seven million hotels via direct interfaces plus HRS, Expedia and Booking.com, Airbnb
  for Work, global rental cars, and ground mobility including the Deutschland-Ticket and
  Flixbus. The product is built for finance departments, emphasizing VAT-compliant automated
  invoicing, German per-diem (VMA) tax logic, centralized billing on a single creditor, real-time
  budget tracking, and automated travel-policy enforcement. It integrates with ERP and accounting
  systems (DATEV, SAP, Microsoft Dynamics, Sage, Addison) and with HRIS platforms, offering
  native Personio synchronization and an External API (ExtAPI) for other HRIS and identity
  systems such as Workday, BambooHR and HiBob. Enterprise authentication is via SAML 2.0
  single sign-on. The company is certified to ISO 27001 and ISO 9001, is GDPR compliant, and
  hosts on European servers. Lanes & Planes is backed by Battery Ventures.'

apis:
- aid: lanes-and-planes:ext-api
  name: Lanes & Planes External API (ExtAPI)
  description: 'The External API (ExtAPI) is named in the company''s own llms.txt as the
    integration surface used to synchronize employee and organizational data from HRIS and
    identity systems that lack a native connector (for example Workday, BambooHR and HiBob),
    alongside the native Personio integration. The API is partner- and customer-gated: Lanes
    & Planes publishes no public developer portal, API reference, OpenAPI definition, or
    self-service credentials, and access is arranged through the implementation manager
    assigned during onboarding. The baseURL below is the live api.lanes-planes.com host on
    the company domain, recorded here as the observed API host; it serves no public
    documentation or discovery document. This entry is a placeholder for a real but
    undocumented API surface, not a description of a published API program.'
